name: APK bauen

# Push auf main und Pull Requests: Tests, Testversion (de.uekala.schichtwerk.test) als Artefakt
# und eine Probe der Release-Signatur mit Wegwerf-Schlüsseln.
# Release (Tag mobile-vX.Y.Z oder „Run workflow“ mit „Release anlegen“ auf main): zusätzlich signierte
# Release-APK und GitHub-Release (für Obtainium).
on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release mobile-v<appVersion> aus main anlegen (Version aus gradle.properties)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # versionCode steigt mit jedem Lauf dieses Workflows (letztes Release vor dem Umbau: 42).
      VERSION_CODE: ${{ github.run_number }}
      RELEASE: ${{ (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')) }}
      # Alter Sideload-Schlüssel (bis 0.1, öffentlich geworden) – Vorgänger in der Lineage.
      ALT_CERT_SHA256: C28E04FE11690E4E6D5C2C7D4B63248BEFE4B162556DFEEB706265C182E348AB
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version prüfen
        run: |
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::appVersion in gradle.properties fehlt oder ist keine Version X.Y.Z"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "mobile-v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu appVersion $VERSION"
            exit 1
          fi
          if [[ "$RELEASE" == "true" && "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "mobile-v$VERSION" > /dev/null; then
            echo "::error::Release mobile-v$VERSION gibt es schon – für ein neues Release appVersion erhöhen und CHANGELOG ergänzen"
            exit 1
          fi
          bash tools/changelog-abschnitt.sh CHANGELOG.md "$VERSION" > /dev/null
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APKs bauen
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Signatur-Probe mit Wegwerf-Schlüsseln
        run: bash tools/signatur-probe.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Testversion benennen
        run: cp app/build/outputs/apk/debug/app-debug.apk "schichtwerk-test-${VERSION_NAME}-${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: schichtwerk-test-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: schichtwerk-test-*.apk

      - name: Release-APK signieren
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          ANDROID_OLD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_OLD_KEYSTORE_PASSWORD }}
          ANDROID_OLD_KEY_ALIAS: ${{ secrets.ANDROID_OLD_KEY_ALIAS }}
        run: bash tools/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "schichtwerk-${VERSION_NAME}.apk"

      - name: Release-Signatur prüfen
        if: env.RELEASE == 'true'
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash tools/verify-apk-signature.sh "schichtwerk-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        if: env.RELEASE == 'true'
        with:
          name: release-apk
          path: schichtwerk-${{ env.VERSION_NAME }}.apk

  release:
    needs: apk
    if: (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-apk

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')"
          TAG="mobile-v$VERSION"
          bash tools/changelog-abschnitt.sh CHANGELOG.md "$VERSION" > notes.md
          APK="schichtwerk-$VERSION.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Von Hand angelegtes Release: APK anhängen, Titel und Text aus dem CHANGELOG
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Schichtwerk Mobile $VERSION" --notes-file notes.md
          else
            # Bei „Run workflow“ entsteht der Tag hier, auf genau dem gebauten Commit
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Schichtwerk Mobile $VERSION" --notes-file notes.md
          fi
