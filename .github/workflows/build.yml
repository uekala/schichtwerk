name: APK bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "schichtwerk-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: schichtwerk-${{ env.VERSION_NAME }}
          path: schichtwerk-*.apk

      - name: Release anlegen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Schichtwerk ${{ env.VERSION_NAME }}
          files: schichtwerk-*.apk
