version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin.android"
          - "org.jetbrains.kotlin.plugin.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
